name: Deploy to InsForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_INSFORGE_APP_URL: ${{ secrets.VITE_INSFORGE_APP_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ secrets.VITE_INSFORGE_ANON_KEY }}

      - name: Deploy Frontend Artifacts
        run: npx @insforge/cli deploy --dir ./dist --token ${{ secrets.INSFORGE_DEPLOY_TOKEN }}
