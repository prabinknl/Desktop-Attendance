name: Deploy to InsForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        env:
          VITE_INSFORGE_APP_URL: ${{ secrets.VITE_INSFORGE_APP_URL }}
          VITE_INSFORGE_ANON_KEY: ${{ secrets.VITE_INSFORGE_ANON_KEY }}

      - name: Authenticate InsForge CLI
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          if [ -z "$INSFORGE_API_KEY" ]; then
            echo "::error::INSFORGE_API_KEY secret is missing! Please add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx @insforge/cli login --user-api-key "$INSFORGE_API_KEY" -y

      - name: Link InsForge Project
        run: npx @insforge/cli link --project-id 37e52add-2bac-45c2-a61a-ff17fcfd7b78 -y

      - name: Deploy Frontend Artifacts
        run: npx @insforge/cli deployments deploy ./dist -y


