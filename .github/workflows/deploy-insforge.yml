name: Deploy to InsForge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: insforge-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  INSFORGE_CLI_VERSION: 'latest'
  INSFORGE_PROJECT_ID: '37e52add-2bac-45c2-a61a-ff17fcfd7b78'

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate with InsForge
        env:
          INSFORGE_USER_API_KEY: ${{ secrets.INSFORGE_USER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${INSFORGE_USER_API_KEY:-}" ]; then
            echo "Authenticating with user API key."
            npx --yes "@insforge/cli@${INSFORGE_CLI_VERSION}" login \
              --user-api-key "${INSFORGE_USER_API_KEY}" --json > /dev/null
          else
            echo "::error::INSFORGE_USER_API_KEY secret is not configured in GitHub repository settings."
            exit 1
          fi

      - name: Link InsForge project
        run: |
          set -euo pipefail
          npx --yes "@insforge/cli@${INSFORGE_CLI_VERSION}" link \
            --project-id "${INSFORGE_PROJECT_ID}" --json --yes > /dev/null

      - name: Deploy to InsForge hosting
        run: |
          set -euo pipefail
          npx --yes "@insforge/cli@${INSFORGE_CLI_VERSION}" deployments deploy . --json
