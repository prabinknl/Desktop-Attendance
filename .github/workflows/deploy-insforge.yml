name: Deploy to InsForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to InsForge
        env:
          INSFORGE_TOKEN: ${{ secrets.INSFORGE_TOKEN }}
        run: npx @insforge/cli deployments deploy dist --yes