name: Build & Release Attendance Desktop

# Desktop Windows installer + electron-updater assets (latest.yml, blockmap).
# Separate from InsForge web deploy (deploy-insforge.yml).
#
# Release process:
#   1. Bump "version" in package.json (e.g. 1.0.4)
#   2. Commit and push to main
#   3. Create and push a matching tag: git tag v1.0.4 && git push origin v1.0.4
#   4. This workflow builds NSIS installer and publishes a GitHub Release
#      Assets: versioned .exe + .blockmap + latest.yml (updater) and
#      Attendance-Desktop-Setup.exe (stable website download URL).
#      The release is published (not left as a draft) so electron-updater can see it.
#
# Releases must use lowercase v + strict semver tags (for example, v1.0.4).
# CI syncs package.json to the pushed tag before building so Electron/Vite stamp
# the release assets with the tagged version even if package.json was bumped ahead.
# Tags like v.1.o.4 or V1.0.4 or V.1.0.4 are INVALID.

on:
  push:
    tags:
      - 'v[0-9]*'   # matches v1.0.4, v2.0.0, etc. — NOT V1.0.0 or v.1.o.3

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync package.json version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Git tag '$TAG' is invalid. Use lowercase v + strict semver (for example, v1.0.16)."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::warning::package.json version '${PKG_VERSION}' does not match pushed tag '${TAG}'. Syncing package.json for this release build."
            npm version "${TAG_VERSION}" --no-git-tag-version --allow-same-version
          else
            echo "package.json version already matches ${TAG}."
          fi
          echo "✅ Using release version ${TAG_VERSION}"

      - name: Build server (TypeScript → JavaScript)
        run: npm run build:server

      - name: Build Electron UI (Vite → dist-electron/)
        run: npm run build:electron-ui

      - name: Stage server resources for packaging
        run: node electron/scripts/prepare-server-resources.mjs

      - name: Ensure GitHub Release exists for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # electron-builder uploads the installer, blockmap, and latest.yml as
          # separate requests, each of which finds-or-creates the release for
          # this tag when --publish always runs. With no release yet, two of
          # those requests have raced and each created their own release
          # object, splitting the assets across two "vX.Y.Z" releases (seen on
          # v1.0.13 — GitHub allowed two releases with the same tag_name).
          # Creating the release synchronously here, before electron-builder
          # starts, means every later find-or-create call finds the one
          # release that already exists instead of racing to create it.
          # Created as a draft so it never becomes GitHub's "latest" release
          # while still empty — the "Publish GitHub Release" step below
          # undrafts it once all assets are verified present. electron-builder
          # reuses an existing release regardless of draft state; releaseType
          # only affects what it does when it has to create one itself.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — reusing it."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes "Attendance Desktop ${GITHUB_REF_NAME}"
            echo "Created draft release ${GITHUB_REF_NAME}."
          fi

      - name: Build & Publish Windows Desktop Release
        shell: bash
        env:
          # electron-builder reads GH_TOKEN for GitHub Releases publishing.
          # GITHUB_TOKEN is automatically provided by GitHub Actions (no setup needed).
          # Optionally set a GH_TOKEN secret (PAT) in repo Settings → Secrets if you
          # need extra permissions (e.g. cross-repo releases), but it is NOT required.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # Use the local electron-builder CLI to avoid npx download race conditions.
          node node_modules/electron-builder/cli.js \
            --win \
            --x64 \
            --publish always

      - name: Create stable installer filename
        shell: bash
        run: node scripts/create-stable-installer.cjs

      - name: Upload website installer and updater blockmap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # electron-builder should already have uploaded the versioned installer
          # and latest.yml. Re-upload the blockmap (v1.0.10 omitted it) and add
          # the stable website filename. --clobber is safe if they already exist.
          gh release upload "${GITHUB_REF_NAME}" \
            "release/Attendance-Desktop-Setup.exe" \
            "release/Attendance.Desktop.Setup.${PKG_VERSION}.exe.blockmap" \
            --clobber

      - name: Verify release assets exist
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_DIR="release"
          INSTALLER="Attendance.Desktop.Setup.${PKG_VERSION}.exe"
          BLOCKMAP="Attendance.Desktop.Setup.${PKG_VERSION}.exe.blockmap"
          LATEST_YML="latest.yml"
          STABLE="Attendance-Desktop-Setup.exe"

          echo "Checking release output directory: ${RELEASE_DIR}/"
          ls -la "${RELEASE_DIR}/" || true

          missing=0
          for f in "${INSTALLER}" "${BLOCKMAP}" "${LATEST_YML}" "${STABLE}"; do
            if [ -f "${RELEASE_DIR}/${f}" ]; then
              echo "✅ ${f}"
            else
              echo "::error::Missing ${RELEASE_DIR}/${f}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          # Fail loudly if electron-builder (or a race) created more than one
          # release for this tag — that previously caused HTTP 422 on undraft.
          DUP_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")] | length")"
          if [ "${DUP_COUNT}" -gt 1 ]; then
            echo "::error::Found ${DUP_COUNT} GitHub releases for tag ${GITHUB_REF_NAME}."
            echo "::error::Delete the orphan duplicate release, then re-run this job."
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | {id, draft, assets:[.assets[].name]}"
            exit 1
          fi

          # electron-builder may already publish a non-draft release when
          # releaseType is "release". Only undraft when still draft so this
          # step stays idempotent (avoids HTTP 422 on already-published tags).
          IS_DRAFT="$(gh release view "${GITHUB_REF_NAME}" --json isDraft -q .isDraft 2>/dev/null || echo true)"
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false
            echo "Published ${GITHUB_REF_NAME} - electron-updater can now see latest.yml"
          else
            echo "${GITHUB_REF_NAME} is already published - electron-updater can see latest.yml"
          fi
