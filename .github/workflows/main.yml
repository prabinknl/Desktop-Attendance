name: Deploy to InsForge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to InsForge
        run: npx @insforge/cli@0.2.2 deployments deploy ./dist --yes
        env:
          INSFORGE_TOKEN: ${{ secrets.INSFORGE_TOKEN }}
